<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>smortboard</title>
  <link rel="stylesheet" href="/ui/base.css">
  <link rel="stylesheet" href="/ui/layout.css">
  <!-- design archive: the fifteen open-card layouts behind the 2026-09-10 pick -->
  <link rel="stylesheet" href="/ui/panel-layouts.css">
  <link rel="stylesheet" href="/ui/telemetry.css">
  <link rel="stylesheet" href="/ui/replay.css">
  <link rel="stylesheet" href="/ui/inbox.css">
  <link rel="stylesheet" href="/ui/pulls.css">
  <link rel="stylesheet" href="/ui/landing.css">
  <link rel="stylesheet" href="/ui/scheduler.css">
  <link rel="stylesheet" href="/ui/preflight.css">
  <link rel="stylesheet" href="/ui/boards.css">
  <link rel="stylesheet" href="/ui/profiles.css">
</head>
<body>
  <!-- board bar: one nav-tab per board, shell.js drives selection and memory -->
  <div class="board-bar" id="board-bar" role="tablist"></div>

  <!-- six columns, each an ordered list of card-strip rows - makeBuckets drives focus. attention
       is not a stored status (board.js's STATUSES stays the five real ones a card can hold) - it
       is a presentation-only column, cards pulled out of their real status bucket by isAttentionCard -->
  <div class="bucket-row" id="bucket-row">
    <div class="bucket" data-status="todo"><div class="bucket-label">to do</div><div class="bucket-rows"></div></div>
    <div class="bucket" data-status="doing"><div class="bucket-label">doing</div><div class="bucket-rows"></div></div>
    <div class="bucket" data-status="attention"><div class="bucket-label">attention</div><div class="bucket-rows"></div></div>
    <div class="bucket" data-status="checking"><div class="bucket-label">checking</div><div class="bucket-rows"></div></div>
    <div class="bucket" data-status="accepted"><div class="bucket-label">accepted</div><div class="bucket-rows"></div></div>
    <div class="bucket" data-status="rejected"><div class="bucket-label">rejected</div><div class="bucket-rows"></div></div>
  </div>

  <script src="/ui/buckets.js"></script>
  <script src="/ui/expand.js"></script>
  <script src="/ui/indicate.js"></script>
  <script src="/ui/drawer.js"></script>
  <script src="/ui/menu.js"></script>
  <script src="/ui/shell.js"></script>
  <script src="/ui/entrytext.js"></script>
  <script src="/ui/pile.js"></script>
  <script src="/ui/messageQueue.js"></script>
  <script src="/ui/columns.js"></script>
  <script src="/ui/card_panel.js"></script>
  <script src="/ui/chat.js"></script>
  <script src="/ui/shortcuts.js"></script>
  <script src="/ui/board.js"></script>
  <script src="/ui/telemetry.js"></script>
  <script src="/ui/costs.js"></script>
  <script src="/ui/replay.js"></script>
  <script src="/ui/inbox.js"></script>
  <script src="/ui/pulls.js"></script>
  <script src="/ui/landing.js"></script>
  <script src="/ui/scheduler.js"></script>
  <script src="/ui/preflight.js"></script>
  <!-- settings.js styles its own button and panel from layout.css - no stylesheet of its own -->
  <script src="/ui/settings.js"></script>
  <script src="/ui/profiles.js"></script>
  <script src="/ui/boards.js"></script>
</body>
</html>
