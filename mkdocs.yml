# the docs site: https://balthazarfitzpatrick.github.io/smortboard/
# build: uv run --group docs mkdocs build --strict   (ci runs the same on every docs change)
# serve: uv run --group docs mkdocs serve

site_name: smortboard
site_description: A kanban board that agents work, not you.
site_url: https://balthazarfitzpatrick.github.io/smortboard/
repo_url: https://github.com/BalthazarFitzpatrick/smortboard
repo_name: BalthazarFitzpatrick/smortboard
# edits go to development, like every other change
edit_uri: edit/development/docs/
docs_dir: docs

theme:
  name: material
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    # dark first, like the board itself
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true

# a broken link or anchor fails the strict build instead of shipping
validation:
  links:
    not_found: warn
    anchors: warn

# the original brief is kept to be found, not surfaced
not_in_nav: |
  /dev-board-brief.md

nav:
  - Home: index.md
  - Get started:
      - Install: get-started/install.md
      - First board: get-started/first-board.md
      - Practice board: beta-test-board.md
      - Protect main: protect-main.md
  - Best practices:
      - Cards: practices/cards.md
      - Leases: practices/leases.md
      - Attention and inbox: practices/attention.md
      - The two gates: practices/gates.md
      - Landing and main: practices/landing.md
      - Waiting pull requests: practices/waiting-prs.md
      - Mission control and workforce: practices/mission-control.md
      - Labs and usage limits: practices/labs.md
      - Cost and budgets: practices/cost.md
      - Runs and the event log: practices/runs.md
      - When to step in: practices/stepping-in.md
  - Reference:
      - Keyboard: reference/keyboard.md
      - Configuration: reference/configuration.md
      - Credential files: reference/credentials.md
      - Backup: reference/backup.md
      - Repos and test commands: reference/repos.md
      - Security: reference/security.md
  - Help:
      - Troubleshooting: help/troubleshooting.md
      - Beta and reporting: help/beta.md
  - Internals:
      - Development: internals/development.md
      - Plan: PLAN.md
      - Phase 1 contracts: PHASE1-CONTRACTS.md
      - Prompts: PROMPTS.md
      - Spikes:
          - S1-S2 headless card runner: spikes/S1-S2-findings.md
          - S3 leases at write time: spikes/S3-findings.md
          - S4 codex events: spikes/S4-codex-events.md
          - S5 codex steering: spikes/S5-codex-steering.md
          - S6 codex hooks: spikes/S6-codex-hooks.md
          - S7 codex auth: spikes/S7-codex-auth.md
