# this is the linux runner - it tests the oldest python smortboard claims to
# support (pyproject requires-python), not just whatever is on a dev machine

name: ci

permissions:
  contents: read

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # fail-fast off: an interesting break on one python version should not
      # cancel a sibling job that is still running fine
      fail-fast: false
      matrix:
        python: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: sync
        run: uv sync --dev --python ${{ matrix.python }}

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest -q -k 'not test_capture_takes_a_real_screenshot_of_a_faked_server'

      - name: provision screenshot image
        run: |
          docker build -f docker/card.Dockerfile -t smortboard-card:ci .
          docker build -f docker/screenshot.Dockerfile --build-arg CARD_IMAGE=smortboard-card:ci -t smortboard-screenshot:ci .

      - name: screenshot with no external network or unrelated host files
        run: |
          mkdir -p .work/screenshot-artifacts
          chmod 777 .work/screenshot-artifacts
          docker run --rm --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit=512 --memory=2g \
            --tmpfs /tmp:rw,nosuid,size=512m \
            --mount type=bind,src="$PWD/smortboard",dst=/workspace/smortboard,readonly \
            --mount type=bind,src="$PWD/tests",dst=/workspace/tests,readonly \
            --mount type=bind,src="$PWD/tools/check_screenshot_isolation.py",dst=/checks/check_screenshot_isolation.py,readonly \
            --mount type=bind,src="$PWD/.work/screenshot-artifacts",dst=/artifacts \
            -e PYTHONDONTWRITEBYTECODE=1 -e UV_CACHE_DIR=/tmp/uv-cache \
            smortboard-screenshot:ci uv run --no-sync python /checks/check_screenshot_isolation.py
