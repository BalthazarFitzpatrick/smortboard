[project]
name = "smortboard"
version = "0.1.0"
description = "a browser-based board built on ui_base, python-served, docker in the backend"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    # pinned while the shared soft focus glow and ambient pulse await release
    # return to a tag once both primitives ship
    "ui_base @ git+https://github.com/BalthazarFitzpatrick/smortui.git@a9a441b205f760109eab16ec1465961d66123a63",
    # os-correct data dir for the default db location — not the cwd, not a hand-rolled path
    "platformdirs>=4.0",
    # mission control's one screenshot per ask - host-side only, chromium headless. the browser
    # binary itself is a separate `playwright install chromium` step, not a pip dependency
    "playwright>=1.40",
]

[project.scripts]
smortboard = "smortboard.cli:main"
smortboard-land = "smortboard.land_cli:main"

# dependency-groups is the current form; [tool.uv] dev-dependencies is deprecated
[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pytest>=8.0",
    # the suite is a thousand small i/o-bound tests, not a few slow ones: measured 2026-09-18 it
    # ran 129s at 37% cpu on ten cores, and 24s under `-n auto`. that difference is what makes
    # running the whole thing before every push affordable
    "pytest-xdist>=3.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ui assets under smortboard/ui/ are not .py files, so hatchling's default python-source
# packaging must be told about them explicitly or the wheel installs but serves nothing
[tool.hatch.build.targets.wheel]
packages = ["smortboard"]
artifacts = ["smortboard/ui/**", "smortboard/labs/*.json", "smortboard/labs/NOTICE", "smortboard/labs/LICENSE.seccomp"]

# hatchling's sdist default is "every git-tracked file" - none of this is needed to pip install
# or run the package; docker/ is for users who clone and build the card image themselves
[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    "docs/images/",
    "ui_shots/",
    "dev_ledger/",
    "TASKS.jsonl",
    "WORKLOG.md",
    "docker/",
    "tools/",
    "CLAUDE.md",
    ".claude/",
    ".github/",
]

# ui_base is pinned to a git sha, not a pypi release, while the two repos are co-developed
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modernise syntax)
    "B",    # flake8-bugbear (common bug patterns)
    "C4",   # flake8-comprehensions (simplify list/dict/set comprehensions)
    "SIM",  # flake8-simplify (simplify boolean logic)
]
ignore = [
    "E501",   # line too long — handled by formatter, not linter
    "B008",   # function calls in default args — common in etl/bi (e.g. datetime.now())
    "SIM108", # ternary — bi pipeline logic is often clearer as full if/else
    "UP007",  # x | y union syntax — keep optional[] for readability
]

[tool.ruff.lint.isort]
known-first-party = ["smortboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# parallel by default - see the dev dependency note. `-n0` puts it back on one process, which is
# what you want when reading one test's output or dropping into a debugger
addopts = "-n auto"
